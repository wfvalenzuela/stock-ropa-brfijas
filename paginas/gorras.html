<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="author" content="Wilfredo Valenzuela">
  <meta name="description" content="Pagina para el stock de ropa en oficina">
  <title>Stock Ropa</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="camisas">

  <main class="contenedor-principal my-5">
    <div class="container">

      <h1 class="text-center mb-4">Stock Ropa Uniforme</h1>

      <section class="tarjeta-producto p-4 border rounded shadow-sm bg-light mx-auto" style="max-width: 700px;">

        <h3 class="text-center mb-4">Gorras</h3>

        <div id="carouselUnico" class="carousel slide carousel-fade mi-carrusel">

          <div class="carousel-inner">

            <!-- gorra -->
            <div class="carousel-item active">
              <img src="../img/botines-gorra/gorra.jpeg" class="d-block w-100 rounded" alt="gorra br fias">

              <div class="p-3 mt-3 bg-white border rounded text-start">
                <h5>Gorra Br Fijas</h5>
                <ul class="list-unstyled mb-0">
                  <li>4 unidades</li>
                </ul>
              </div>
            </div>


            <button class="carousel-control-prev" type="button" data-bs-target="#carouselUnico" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Anterior</span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselUnico" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Siguiente</span>
            </button>
          </div>
      </section>

      <div class="text-center mt-4">
        <a href="../index.html" class="btn btn-primary" role="button">Volver a la Página Principal</a>
      </div>
    </div>
  </main>

  <footer class="footer text-center py-3">
    <p>© TODOS LOS DERECHOS RESERVADOS</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
